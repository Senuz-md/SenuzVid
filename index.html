<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>SenuzVid - Simple TikTok Downloader</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #0f0f15;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: rgba(25, 25, 35, 0.95);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 25px;
      padding: 30px 20px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { color: #ffd700; font-size: 28px; margin-bottom: 5px; }
    p.sub { color: #888; font-size: 12px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; }
    
    .box {
      background: #000;
      border: 2px solid rgba(255, 215, 0, 0.4);
      border-radius: 14px;
      display: flex;
      padding: 5px;
      margin-bottom: 15px;
    }
    .input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .get {
      background: linear-gradient(45deg, #ffd700, #f39c12);
      color: #000;
      border: none;
      padding: 0 20px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }
    
    #loading { font-size: 13px; color: #ffd700; margin-bottom: 15px; font-weight: 600; }
    
    .preview {
      display: none;
      background: rgba(255,255,255,0.03);
      border-radius: 15px;
      padding: 15px;
      margin-top: 15px;
      text-align: left;
    }
    .v-flex { display: flex; gap: 15px; align-items: center; }
    .v-img { width: 80px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #ffd700; }
    .v-title { font-size: 12px; color: #ddd; margin-bottom: 10px; line-height: 1.4; }
    
    .btn-dl {
      display: block;
      background: #27ae60;
      color: #fff;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      margin-top: 8px;
    }
    .btn-dl.mp3 { background: #2980b9; }
  </style>
</head>
<body>

  <div class="card">
    <h1><i class="fa-brands fa-tiktok"></i> SenuzVid</h1>
    <p class="sub">TikTok Downloader</p>

    <div class="box">
      <input id="url" class="input" placeholder="Paste TikTok link here..." autocomplete="off">
      <button id="get" class="get">GET</button>
    </div>

    <div id="loading"></div>

    <div id="preview" class="preview">
      <div class="v-flex">
        <img id="thumb" class="v-img" src="" alt="Thumbnail">
        <div>
          <p id="title" class="v-title"></p>
        </div>
      </div>
      <a id="btn-video" class="btn-dl" target="_blank">DOWNLOAD VIDEO (NO WATERMARK)</a>
      <a id="btn-mp3" class="btn-dl mp3" target="_blank">DOWNLOAD MP3 AUDIO</a>
    </div>
  </div>

  <script>
    document.getElementById('get').addEventListener('click', async () => {
      const val = document.getElementById('url').value.trim();
      const load = document.getElementById('loading');
      const preview = document.getElementById('preview');
      
      if (!val) {
        alert("Please paste a TikTok link first!");
        return;
      }

      load.innerText = "Connecting to server...";
      preview.style.display = 'none';

      try {
        // TikWM Official API Call
        const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(val)}`);
        const json = await response.json();

        if (json && json.code === 0 && json.data) {
          const data = json.data;
          
          document.getElementById('thumb').src = data.cover || '';
          document.getElementById('title').innerText = data.title || 'TikTok Video';
          
          document.getElementById('btn-video').href = data.play || '';
          document.getElementById('btn-mp3').href = data.music || '';

          load.innerText = "";
          preview.style.display = 'block';
        } else {
          load.innerText = "";
          alert("Failed to fetch! Make sure the link is a valid public TikTok link.");
        }
      } catch (err) {
        load.innerText = "";
        alert("Connection failed! Please check your internet connection.");
      }
    });
  </script>

</body>
</html>
